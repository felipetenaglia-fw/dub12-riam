<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RIAM Music Platform</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, #00B1D3 0%, #8874B3 100%);
            background-attachment: fixed;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            height: 80px;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #231F20;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .form-input:focus {
            outline: none;
            border-color: #00B1D3;
            box-shadow: 0 0 0 3px rgba(0, 177, 211, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #00B1D3, #0099b8);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 177, 211, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 177, 211, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .demo-credentials {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(0, 177, 211, 0.05);
            border-radius: 8px;
            border: 1px dashed rgba(0, 177, 211, 0.3);
        }

        .demo-credentials h4 {
            margin: 0 0 0.75rem 0;
            color: #333;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .demo-credentials p {
            margin: 0.25rem 0;
            font-size: 0.85rem;
            color: #666;
        }

        .quick-login-btns {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .quick-login-btn {
            flex: 1;
            padding: 0.5rem;
            background: white;
            border: 1px solid #00B1D3;
            color: #00B1D3;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .quick-login-btn:hover {
            background: #00B1D3;
            color: white;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 2rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
    <script src="config.js?v=3"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="RIAM_Logo_Blk.png" alt="RIAM Logo" class="login-logo">
                <h1>Welcome to RIAM</h1>
                <p>Sign in to continue your musical journey</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" id="loginBtn" class="login-btn">
                    <span id="loginBtnText">Sign In</span>
                    <div id="loadingSpinner" class="loading-spinner"></div>
                </button>
            </form>

            <div class="demo-credentials">
                <h4><i class="fas fa-info-circle"></i> Demo Accounts</h4>
                <p><strong>Student:</strong> username: <code>student</code> / password: <code>student</code></p>
                <p><strong>Teacher:</strong> username: <code>teacher</code> / password: <code>teacher</code></p>
                <p><strong>Admin:</strong> username: <code>admin</code> / password: <code>admin</code></p>
                <div class="quick-login-btns">
                    <button class="quick-login-btn" onclick="quickLogin('student', 'student')">
                        <i class="fas fa-user-graduate"></i> Student
                    </button>
                    <button class="quick-login-btn" onclick="quickLogin('teacher', 'teacher')">
                        <i class="fas fa-chalkboard-teacher"></i> Teacher
                    </button>
                    <button class="quick-login-btn" onclick="quickLogin('admin', 'admin')">
                        <i class="fas fa-user-shield"></i> Admin
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get API base URL - wait for config if needed
        async function getApiBaseUrl() {
            await window.RIAM_CONFIG_READY;
            return window.RIAM_CONFIG?.apiBaseUrl;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            await performLogin(username, password);
        });

        function quickLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            performLogin(username, password);
        }

        async function performLogin(username, password) {
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const errorMessage = document.getElementById('errorMessage');

            // Show loading state
            loginBtn.disabled = true;
            loginBtnText.style.display = 'none';
            loadingSpinner.style.display = 'block';
            errorMessage.classList.remove('show');

            try {
                // Wait for config to be ready
                const API_BASE_URL = await getApiBaseUrl();
                
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || 'Invalid credentials');
                }

                const data = await response.json();
                const authToken = data.access_token;
                localStorage.setItem('access_token', authToken);

                // Get user info
                const userResponse = await fetch(`${API_BASE_URL}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (userResponse.ok) {
                    const currentUser = await userResponse.json();
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    
                    // Redirect to main app
                    window.location.href = 'index.html';
                } else {
                    throw new Error('Failed to get user information');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message || 'Login failed. Please try again.';
                errorMessage.classList.add('show');
                
                // Reset button
                loginBtn.disabled = false;
                loginBtnText.style.display = 'inline';
                loadingSpinner.style.display = 'none';
            }
        }

        // Check if already logged in
        if (localStorage.getItem('access_token')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
